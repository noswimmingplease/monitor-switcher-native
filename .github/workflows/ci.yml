name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: 'true'

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore .\MonitorSwitcher.sln

      - name: Build
        shell: pwsh
        run: dotnet build .\MonitorSwitcher.sln -c Release --no-restore

      - name: Verify native-only dependency boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $trackedBinaries = @(git ls-files -- '*.exe' '*.dll')
          if ($trackedBinaries.Count -gt 0) {
            throw "Repository unexpectedly tracks executable dependencies: $($trackedBinaries -join ', ')"
          }

          $projectFiles = @(git ls-files -- '*.csproj')
          $packageReferences = @($projectFiles |
            ForEach-Object { Select-String -LiteralPath $_ -Pattern '<PackageReference\b' })
          if ($packageReferences.Count -gt 0) {
            throw "Native-only projects must not add package dependencies: $($packageReferences.Path -join ', ')"
          }

          $runtimeNoticeName = 'DOTNET-RUNTIME-THIRD-PARTY-NOTICES.txt'
          if (@(git ls-files -- $runtimeNoticeName).Count -ne 1) {
            throw "$runtimeNoticeName must be tracked."
          }
          $runtimeNoticePath = Join-Path $PWD $runtimeNoticeName
          if (-not (Test-Path -LiteralPath $runtimeNoticePath -PathType Leaf)) {
            throw "$runtimeNoticeName is missing."
          }
          $runtimeNoticeText = [System.IO.File]::ReadAllText($runtimeNoticePath)
          $canonicalNoticeBytes = [System.Text.UTF8Encoding]::new($false).GetBytes(
            ($runtimeNoticeText -replace '\r?\n', "`r`n"))
          $runtimeNoticeHash = [Convert]::ToHexString(
            [System.Security.Cryptography.SHA256]::HashData($canonicalNoticeBytes))
          $expectedRuntimeNoticeHash = 'B60B2912DA28EAA6518593C9E2EFB5334EE062D3C42E80D8FDFA806B3DC52977'
          if ($runtimeNoticeHash -ne $expectedRuntimeNoticeHash) {
            throw "$runtimeNoticeName does not match the reviewed .NET 8.0.30 runtime notice."
          }

          $allowedProjectBinaries = @(
            'MonitorSwitcher.exe',
            'MonitorSwitcher.dll',
            'MonitorSwitcher.Tests.exe',
            'MonitorSwitcher.Tests.dll'
          )
          $unexpectedBuildBinaries = @(Get-ChildItem -Path .\MonitorSwitcher\bin\Release,.\MonitorSwitcher.Tests\bin\Release -Recurse -File |
            Where-Object {
              $_.Extension -in @('.exe', '.dll') -and
              $_.Name -notin $allowedProjectBinaries
            })
          if ($unexpectedBuildBinaries.Count -gt 0) {
            throw "Build output contains an unexpected executable dependency: $($unexpectedBuildBinaries.FullName -join ', ')"
          }

      - name: Run regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $output = @(dotnet run --project .\MonitorSwitcher.Tests\MonitorSwitcher.Tests.csproj -c Release --no-build 2>&1)
          $exitCode = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $lines = @($output | ForEach-Object { $_.ToString().TrimEnd() })
          $lines | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            throw "Regression runner failed with exit code $exitCode."
          }
          if ($lines -match '^FAIL ') {
            throw 'Regression runner reported one or more FAIL lines.'
          }
          $finalLine = $lines | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Last 1
          if ($finalLine -notmatch '^[0-9]+ test\(s\) passed\.$') {
            throw 'Regression runner did not print its authoritative passed-test summary.'
          }
