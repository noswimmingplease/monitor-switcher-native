name: Build and Publish Release

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: 'true'
  RUNTIME_PACK_VERSION: '8.0.30'

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag || github.run_id }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to build and publish (leave blank for an artifact-only test build)
        required: false
        type: string

jobs:
  build_release_zip:
    runs-on: windows-latest
    outputs:
      publish_release: ${{ steps.build.outputs.publish_release }}
      artifact_name: ${{ steps.build.outputs.artifact_name }}
      checksum_name: ${{ steps.build.outputs.checksum_name }}
      release_tag: ${{ steps.build.outputs.release_tag }}
      resolved_commit: ${{ steps.verify_ref.outputs.resolved_commit }}
      zip_name: ${{ steps.build.outputs.zip_name }}

    steps:
      - name: Resolve build reference and version
        id: build
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
          RUN_NUMBER: ${{ github.run_number }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'

          $tag = if ($env:EVENT_NAME -eq 'push') {
            $env:PUSH_TAG
          } else {
            $env:REQUESTED_TAG
          }

          if (-not [string]::IsNullOrWhiteSpace($tag)) {
            if ($tag -cnotmatch '^v(?<version>(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$') {
              throw "Tag '$tag' must use the exact vX.Y.Z format."
            }

            $version = $Matches['version']
            $versionParts = $version.Split('.') | ForEach-Object { [int]$_ }
            if ($versionParts | Where-Object { $_ -gt 65534 }) {
              throw "Tag '$tag' contains a version component greater than 65534, which is not valid assembly metadata."
            }

            $checkoutRef = "refs/tags/$tag"
            $versionLabel = $tag
            $assemblyVersion = "$version.0"
            $informationalVersion = $version
            $publishRelease = 'true'
            $releaseTag = $tag
          } else {
            if ($env:EVENT_NAME -ne 'workflow_dispatch') {
              throw 'Only a tag push or manual workflow run can build a release.'
            }

            $shortSha = $env:SOURCE_SHA.Substring(0, 7)
            $version = "0.0.0-ci.$env:RUN_NUMBER"
            $checkoutRef = $env:SOURCE_SHA
            $versionLabel = "manual-$env:RUN_NUMBER"
            $assemblyVersion = '0.0.0.0'
            $informationalVersion = "$version+$shortSha"
            $publishRelease = 'false'
            $releaseTag = ''
          }

          $artifactName = "MonitorSwitcher-$versionLabel-win-x64"
          $zipName = "$artifactName.zip"
          $checksumName = "$zipName.sha256"

          "assembly_version=$assemblyVersion" >> $env:GITHUB_OUTPUT
          "publish_release=$publishRelease" >> $env:GITHUB_OUTPUT
          "artifact_name=$artifactName" >> $env:GITHUB_OUTPUT
          "checksum_name=$checksumName" >> $env:GITHUB_OUTPUT
          "checkout_ref=$checkoutRef" >> $env:GITHUB_OUTPUT
          "file_version=$assemblyVersion" >> $env:GITHUB_OUTPUT
          "informational_version=$informationalVersion" >> $env:GITHUB_OUTPUT
          "package_version=$version" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.build.outputs.checkout_ref }}

      - name: Verify checked-out reference
        id: verify_ref
        shell: pwsh
        env:
          EXPECTED_REF: ${{ steps.build.outputs.checkout_ref }}
          RELEASE_TAG: ${{ steps.build.outputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actualCommit = (git rev-parse HEAD).Trim()

          if (-not [string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
            $expectedCommit = (git rev-parse "$env:EXPECTED_REF^{commit}").Trim()
          } else {
            $expectedCommit = (git rev-parse $env:EXPECTED_REF).Trim()
          }

          if ($actualCommit -ne $expectedCommit) {
            throw "Checkout mismatch: expected $expectedCommit but found $actualCommit."
          }
          "resolved_commit=$actualCommit" >> $env:GITHUB_OUTPUT

      - name: Verify native-only dependency boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $trackedBinaries = @(git ls-files -- '*.exe' '*.dll')
          if ($trackedBinaries.Count -gt 0) {
            throw "Repository unexpectedly tracks executable dependencies: $($trackedBinaries -join ', ')"
          }

          $projectFiles = @(git ls-files -- '*.csproj')
          $packageReferences = @($projectFiles |
            ForEach-Object { Select-String -LiteralPath $_ -Pattern '<PackageReference\b' })
          if ($packageReferences.Count -gt 0) {
            throw "Native-only projects must not add package dependencies: $($packageReferences.Path -join ', ')"
          }

          $runtimeNoticeName = 'DOTNET-RUNTIME-THIRD-PARTY-NOTICES.txt'
          if (@(git ls-files -- $runtimeNoticeName).Count -ne 1) {
            throw "$runtimeNoticeName must be tracked."
          }
          $runtimeNoticePath = Join-Path $PWD $runtimeNoticeName
          if (-not (Test-Path -LiteralPath $runtimeNoticePath -PathType Leaf)) {
            throw "$runtimeNoticeName is missing."
          }
          $runtimeNoticeText = [System.IO.File]::ReadAllText($runtimeNoticePath)
          $canonicalNoticeBytes = [System.Text.UTF8Encoding]::new($false).GetBytes(
            ($runtimeNoticeText -replace '\r?\n', "`r`n"))
          $runtimeNoticeHash = [Convert]::ToHexString(
            [System.Security.Cryptography.SHA256]::HashData($canonicalNoticeBytes))
          $expectedRuntimeNoticeHash = 'B60B2912DA28EAA6518593C9E2EFB5334EE062D3C42E80D8FDFA806B3DC52977'
          if ($runtimeNoticeHash -ne $expectedRuntimeNoticeHash) {
            throw "$runtimeNoticeName does not match the reviewed .NET 8.0.30 runtime notice."
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore .\MonitorSwitcher.sln

      - name: Build
        shell: pwsh
        run: dotnet build .\MonitorSwitcher.sln -c Release --no-restore

      - name: Run regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $output = @(dotnet run --project .\MonitorSwitcher.Tests\MonitorSwitcher.Tests.csproj -c Release --no-build 2>&1)
          $exitCode = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $lines = @($output | ForEach-Object { $_.ToString().TrimEnd() })
          $lines | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            throw "Regression runner failed with exit code $exitCode."
          }
          if ($lines -match '^FAIL ') {
            throw 'Regression runner reported one or more FAIL lines.'
          }
          $finalLine = $lines | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Last 1
          if ($finalLine -notmatch '^[0-9]+ test\(s\) passed\.$') {
            throw 'Regression runner did not print its authoritative passed-test summary.'
          }

      - name: Publish app
        shell: pwsh
        env:
          ASSEMBLY_VERSION: ${{ steps.build.outputs.assembly_version }}
          FILE_VERSION: ${{ steps.build.outputs.file_version }}
          INFORMATIONAL_VERSION: ${{ steps.build.outputs.informational_version }}
          PACKAGE_VERSION: ${{ steps.build.outputs.package_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $publishPath = Join-Path $PWD 'artifacts\publish'
          if (Test-Path -LiteralPath $publishPath) {
            Remove-Item -LiteralPath $publishPath -Recurse -Force
          }

          dotnet publish .\MonitorSwitcher\MonitorSwitcher.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o .\artifacts\publish `
            "-p:AssemblyVersion=$env:ASSEMBLY_VERSION" `
            "-p:FileVersion=$env:FILE_VERSION" `
            "-p:InformationalVersion=$env:INFORMATIONAL_VERSION" `
            "-p:PackageVersion=$env:PACKAGE_VERSION" `
            "-p:Version=$env:PACKAGE_VERSION" `
            "-p:RuntimeFrameworkVersion=$env:RUNTIME_PACK_VERSION" `
            -p:ContinuousIntegrationBuild=true `
            -p:IncludeSourceRevisionInInformationalVersion=false

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed with exit code $LASTEXITCODE."
          }

      - name: Verify published metadata, documentation and dependency boundary
        shell: pwsh
        env:
          ASSEMBLY_VERSION: ${{ steps.build.outputs.assembly_version }}
          FILE_VERSION: ${{ steps.build.outputs.file_version }}
          INFORMATIONAL_VERSION: ${{ steps.build.outputs.informational_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $publishDir = Resolve-Path .\artifacts\publish
          $assemblyPath = Join-Path $publishDir 'MonitorSwitcher.dll'
          $assemblyName = [System.Reflection.AssemblyName]::GetAssemblyName($assemblyPath)
          $versionInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($assemblyPath)

          if ($assemblyName.Version.ToString() -ne $env:ASSEMBLY_VERSION) {
            throw "Assembly version mismatch: expected $env:ASSEMBLY_VERSION, found $($assemblyName.Version)."
          }
          if ($versionInfo.FileVersion -ne $env:FILE_VERSION) {
            throw "File version mismatch: expected $env:FILE_VERSION, found $($versionInfo.FileVersion)."
          }
          if ($versionInfo.ProductVersion -ne $env:INFORMATIONAL_VERSION) {
            throw "Product version mismatch: expected $env:INFORMATIONAL_VERSION, found $($versionInfo.ProductVersion)."
          }

          foreach ($fileName in @(
            'LICENSE',
            'README.md',
            'RELEASE_NOTES.md',
            'THIRD-PARTY-NOTICES.md',
            'DOTNET-RUNTIME-THIRD-PARTY-NOTICES.txt'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $publishDir $fileName))) {
              throw "Published output is missing $fileName."
            }
          }

          $deps = Get-Content -Raw -LiteralPath (Join-Path $publishDir 'MonitorSwitcher.deps.json') |
            ConvertFrom-Json
          $runtimePackLibraries = @($deps.libraries.PSObject.Properties |
            Where-Object { $_.Name -like 'runtimepack.Microsoft.NETCore.App.Runtime.win-x64/*' })
          if ($runtimePackLibraries.Count -ne 1) {
            throw 'Published dependency metadata does not identify exactly one x64 .NET runtime pack.'
          }
          $windowsDesktopPackLibraries = @($deps.libraries.PSObject.Properties |
            Where-Object { $_.Name -like 'runtimepack.Microsoft.WindowsDesktop.App.Runtime.win-x64/*' })
          if ($windowsDesktopPackLibraries.Count -ne 1) {
            throw 'Published dependency metadata does not identify exactly one x64 Windows Desktop runtime pack.'
          }
          $runtimePackVersion = $runtimePackLibraries[0].Name.Split('/', 2)[1]
          $windowsDesktopPackVersion = $windowsDesktopPackLibraries[0].Name.Split('/', 2)[1]
          $reviewedRuntimePackVersion = $env:RUNTIME_PACK_VERSION
          if ([string]::IsNullOrWhiteSpace($reviewedRuntimePackVersion)) {
            throw 'The reviewed runtime-pack version was not configured.'
          }
          if ($runtimePackVersion -ne $reviewedRuntimePackVersion -or
              $windowsDesktopPackVersion -ne $reviewedRuntimePackVersion) {
            throw "The resolved runtime packs changed from $reviewedRuntimePackVersion (Core=$runtimePackVersion, WindowsDesktop=$windowsDesktopPackVersion). Refresh the tracked runtime notices and provenance before releasing."
          }

          $globalPackagesDir = if ([string]::IsNullOrWhiteSpace($env:NUGET_PACKAGES)) {
            Join-Path $env:USERPROFILE '.nuget\packages'
          } else {
            $env:NUGET_PACKAGES
          }
          $resolvedRuntimeNotice = Join-Path $globalPackagesDir (
            "microsoft.netcore.app.runtime.win-x64\$runtimePackVersion\THIRD-PARTY-NOTICES.TXT")
          if (-not (Test-Path -LiteralPath $resolvedRuntimeNotice -PathType Leaf)) {
            throw "The resolved runtime notice was not found at $resolvedRuntimeNotice."
          }

          $trackedRuntimeNotice = Join-Path $PWD 'DOTNET-RUNTIME-THIRD-PARTY-NOTICES.txt'
          $publishedRuntimeNotice = Join-Path $publishDir 'DOTNET-RUNTIME-THIRD-PARTY-NOTICES.txt'
          $resolvedNoticeHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $resolvedRuntimeNotice).Hash
          $trackedNoticeHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $trackedRuntimeNotice).Hash
          $publishedNoticeHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $publishedRuntimeNotice).Hash
          if ($trackedNoticeHash -ne $resolvedNoticeHash -or $publishedNoticeHash -ne $resolvedNoticeHash) {
            throw 'The tracked or published .NET runtime notice does not match the resolved runtime pack.'
          }

          $resolvedDesktopLicense = Join-Path $globalPackagesDir (
            "microsoft.windowsdesktop.app.runtime.win-x64\$windowsDesktopPackVersion\LICENSE")
          if (-not (Test-Path -LiteralPath $resolvedDesktopLicense -PathType Leaf)) {
            throw "The resolved Windows Desktop runtime licence was not found at $resolvedDesktopLicense."
          }
          $expectedDesktopLicenseHash = 'A89886665765362EB77E0F8E26602C924520041D1711B2EEDC136434FE4D01AB'
          $desktopLicenseHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $resolvedDesktopLicense).Hash
          if ($desktopLicenseHash -ne $expectedDesktopLicenseHash) {
            throw 'The Windows Desktop runtime licence changed. Refresh the documented provenance before releasing.'
          }

          $unexpectedExecutables = @(Get-ChildItem -LiteralPath $publishDir -Recurse -File -Filter '*.exe' |
            Where-Object { $_.Name -notin @('MonitorSwitcher.exe', 'createdump.exe') })
          if ($unexpectedExecutables.Count -gt 0) {
            throw "Publish output contains an unexpected executable: $($unexpectedExecutables.FullName -join ', ')"
          }

      - name: Create zip package
        shell: pwsh
        env:
          CHECKSUM_NAME: ${{ steps.build.outputs.checksum_name }}
          ZIP_NAME: ${{ steps.build.outputs.zip_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zipPath = Join-Path .\artifacts $env:ZIP_NAME
          if (Test-Path -LiteralPath $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $publishRoot = (Resolve-Path .\artifacts\publish).Path
          $files = @(Get-ChildItem -LiteralPath $publishRoot -Recurse -File | Sort-Object {
            [System.IO.Path]::GetRelativePath($publishRoot, $_.FullName).Replace('\', '/')
          })
          if ($files.Count -eq 0) {
            throw 'Publish output is empty.'
          }

          $zipStream = [System.IO.File]::Open(
            $zipPath,
            [System.IO.FileMode]::CreateNew,
            [System.IO.FileAccess]::ReadWrite,
            [System.IO.FileShare]::None)
          try {
            $archive = [System.IO.Compression.ZipArchive]::new(
              $zipStream,
              [System.IO.Compression.ZipArchiveMode]::Create,
              $true,
              [System.Text.Encoding]::UTF8)
            try {
              $fixedTimestamp = [System.DateTimeOffset]::new(
                1980, 1, 1, 0, 0, 0, [System.TimeSpan]::Zero)
              foreach ($file in $files) {
                $relativePath = [System.IO.Path]::GetRelativePath($publishRoot, $file.FullName).Replace('\', '/')
                $entry = $archive.CreateEntry(
                  $relativePath,
                  [System.IO.Compression.CompressionLevel]::Optimal)
                $entry.LastWriteTime = $fixedTimestamp
                $sourceStream = [System.IO.File]::OpenRead($file.FullName)
                $entryStream = $entry.Open()
                try {
                  $sourceStream.CopyTo($entryStream)
                } finally {
                  $entryStream.Dispose()
                  $sourceStream.Dispose()
                }
              }
            } finally {
              $archive.Dispose()
            }
          } finally {
            $zipStream.Dispose()
          }

          $checksumPath = Join-Path .\artifacts $env:CHECKSUM_NAME
          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:ZIP_NAME" | Set-Content -LiteralPath $checksumPath -Encoding utf8 -NoNewline
          Write-Host "SHA-256: $hash"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: ${{ steps.build.outputs.artifact_name }}
          path: |
            .\artifacts\${{ steps.build.outputs.zip_name }}
            .\artifacts\${{ steps.build.outputs.checksum_name }}

  publish_release:
    needs: build_release_zip
    if: needs.build_release_zip.outputs.publish_release == 'true'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build_release_zip.outputs.artifact_name }}
          path: .\artifacts

      - name: Create draft, attach verified assets, then publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHECKSUM_NAME: ${{ needs.build_release_zip.outputs.checksum_name }}
          RELEASE_TAG: ${{ needs.build_release_zip.outputs.release_tag }}
          RESOLVED_COMMIT: ${{ needs.build_release_zip.outputs.resolved_commit }}
          ZIP_NAME: ${{ needs.build_release_zip.outputs.zip_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zipPath = Join-Path .\artifacts $env:ZIP_NAME
          $checksumPath = Join-Path .\artifacts $env:CHECKSUM_NAME

          $currentTagCommit = (gh api "repos/$env:GH_REPO/commits/$env:RELEASE_TAG" --jq .sha).Trim()
          if ($LASTEXITCODE -ne 0 -or $currentTagCommit -ne $env:RESOLVED_COMMIT) {
            throw "Tag $env:RELEASE_TAG no longer resolves to the commit that produced these assets."
          }

          $checksumText = [System.IO.File]::ReadAllText($checksumPath).Trim().TrimStart([char]0xFEFF)
          $escapedZipName = [System.Text.RegularExpressions.Regex]::Escape($env:ZIP_NAME)
          if ($checksumText -cnotmatch "^(?<hash>[0-9a-f]{64})  $escapedZipName$") {
            throw 'The downloaded checksum sidecar has an unexpected format or filename.'
          }
          $localZipHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($localZipHash -cne $Matches['hash']) {
            throw 'The downloaded workflow ZIP does not match its SHA-256 sidecar.'
          }
          $localChecksumHash = (Get-FileHash -LiteralPath $checksumPath -Algorithm SHA256).Hash.ToLowerInvariant()

          $existingRelease = $null
          $ErrorActionPreference = 'Continue'
          $releaseJson = gh release view $env:RELEASE_TAG --repo $env:GH_REPO --json isDraft,isPrerelease,assets 2>$null
          $viewExitCode = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($viewExitCode -eq 0) {
            $existingRelease = $releaseJson | ConvertFrom-Json
            if (-not $existingRelease.isDraft) {
              throw "Release $env:RELEASE_TAG is already public. Refusing to replace immutable public assets."
            }
            if ($existingRelease.isPrerelease) {
              throw "Release $env:RELEASE_TAG is a pre-release draft. Refusing to publish it as the stable update channel."
            }
          } elseif ($viewExitCode -ne 1) {
            throw "Unable to determine whether release $env:RELEASE_TAG already exists."
          }

          if ($null -eq $existingRelease) {
            gh release create $env:RELEASE_TAG `
              --draft `
              --verify-tag `
              --title "Monitor Switcher $env:RELEASE_TAG" `
              --repo $env:GH_REPO
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to create draft release $env:RELEASE_TAG."
            }
          }

          $releaseBaseUrl = "https://github.com/$env:GH_REPO/releases/download/$env:RELEASE_TAG"
          $releaseNotes = @(
            '## Download',
            '',
            "[Download Monitor Switcher $env:RELEASE_TAG for Windows x64]($releaseBaseUrl/$env:ZIP_NAME)",
            '',
            'Extract the ZIP, then open `MonitorSwitcher.exe`. No installer, separate .NET download or external monitor utility is required. Requires 64-bit Windows 10 or Windows 11.',
            '',
            '## What''s new',
            '',
            '- Keeps the window responsive during profile application and replaces the blocking success dialogue with an inline message.',
            '- Prevents stale monitor detection from leaving Apply enabled after a refresh failure, while retaining verification and rollback safeguards.',
            '',
            '## Upgrading from an older version',
            '',
            'Close Monitor Switcher, extract the new ZIP to a permanent folder and replace the existing application files. Profiles and settings under `%APPDATA%\WorkMonitorSwitcher` are not replaced.',
            '',
            '## Windows SmartScreen',
            '',
            'Monitor Switcher is open source but is not Authenticode-signed, so Windows may show an **Unknown publisher**, **Windows protected your PC** or unrecognised-app warning.',
            '',
            "Download only from this repository and compare the ZIP with the attached [``$env:CHECKSUM_NAME``]($releaseBaseUrl/$env:CHECKSUM_NAME). After successful verification, a standard unmanaged Windows installation normally allows **More info** -> **Run anyway**. Smart App Control or an organisation's policy may block unsigned applications.",
            '',
            "[Read Microsoft's SmartScreen guidance](https://learn.microsoft.com/windows/apps/package-and-deploy/smartscreen-reputation)."
          ) -join [System.Environment]::NewLine
          $notesPath = Join-Path $env:RUNNER_TEMP 'monitor-switcher-release-notes.md'
          [System.IO.File]::WriteAllText(
            $notesPath,
            $releaseNotes,
            [System.Text.UTF8Encoding]::new($false))
          gh release edit $env:RELEASE_TAG --notes-file $notesPath --repo $env:GH_REPO
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to set the end-user release notes. The release remains a draft.'
          }

          # Assets are only mutable while the release is a draft. Publishing is
          # the final operation, after build, tests, package verification and upload.
          gh release upload $env:RELEASE_TAG $zipPath $checksumPath --clobber --repo $env:GH_REPO
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to attach the verified release assets. The release remains a draft."
          }

          $release = gh release view $env:RELEASE_TAG --repo $env:GH_REPO --json isDraft,isPrerelease,assets |
            ConvertFrom-Json
          if (-not $release.isDraft) {
            throw "Release $env:RELEASE_TAG became public before verification completed."
          }
          if ($release.isPrerelease) {
            throw "Draft release $env:RELEASE_TAG is marked as a pre-release and will not be published."
          }

          $expectedAssetNames = @($env:ZIP_NAME, $env:CHECKSUM_NAME) | Sort-Object
          $assetNames = @($release.assets | ForEach-Object { $_.name }) | Sort-Object
          if ($assetNames.Count -ne $expectedAssetNames.Count) {
            throw "Draft release contains unexpected or missing assets: $($assetNames -join ', ')."
          }
          for ($index = 0; $index -lt $expectedAssetNames.Count; $index++) {
            if (-not $assetNames[$index].Equals(
                $expectedAssetNames[$index],
                [System.StringComparison]::Ordinal)) {
              throw "Draft release asset set is not exact: $($assetNames -join ', ')."
            }
          }

          foreach ($localAssetPath in @($zipPath, $checksumPath)) {
            $localAsset = Get-Item -LiteralPath $localAssetPath
            $remoteAsset = @($release.assets | Where-Object {
              $_.name.Equals($localAsset.Name, [System.StringComparison]::Ordinal)
            })
            if ($remoteAsset.Count -ne 1 -or [long]$remoteAsset[0].size -ne $localAsset.Length) {
              throw "Uploaded asset $($localAsset.Name) does not match the local verified file size."
            }

            $expectedDigest = if ($localAsset.Name -ceq $env:ZIP_NAME) {
              "sha256:$localZipHash"
            } else {
              "sha256:$localChecksumHash"
            }
            if ($remoteAsset[0].PSObject.Properties.Name -contains 'digest' -and
                -not [string]::IsNullOrWhiteSpace($remoteAsset[0].digest) -and
                $remoteAsset[0].digest -cne $expectedDigest) {
              throw "Uploaded asset $($localAsset.Name) does not match the local SHA-256 digest."
            }
          }

          $finalTagCommit = (gh api "repos/$env:GH_REPO/commits/$env:RELEASE_TAG" --jq .sha).Trim()
          if ($LASTEXITCODE -ne 0 -or $finalTagCommit -ne $env:RESOLVED_COMMIT) {
            throw "Tag $env:RELEASE_TAG changed after asset verification. The release remains a draft."
          }

          gh release edit $env:RELEASE_TAG --draft=false --repo $env:GH_REPO
          if ($LASTEXITCODE -ne 0) {
            throw "Verified assets were attached, but the release could not be published and remains a draft."
          }
